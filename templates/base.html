<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Joel M. A. Website Portfolio</title>
    <!-- Tailwind v4 Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">



    <!-- Register the font for Tailwind -->
    <style type="text/tailwindcss">
        @theme {
        --font-michroma: "Michroma", sans-serif;
      }
    </style>
</head>


<body class="w-full font-michroma bg-stone-50">
    <nav class="h-20 bg-white p-4 text-black flex justify-between items-end z-10 shadow-lg sticky top-0 left-0">
        <div class="flex justify-between items-center h-fit gap-4">
            <a href="{% url 'home' %}" class="mx-4 hover:bg-black hover:text-white duration-300 ease-in px-2 py-0.5 rounded-sm">Home</a>
            <a class="mx-4 hover:bg-black hover:text-white duration-300 ease-in px-2 py-0.5 rounded-sm" href="{% url 'weather' %}">Weather</a>
        </div>
        <div class="flex justify-between items-center h-fit gap-4">
            {% if user.is_authenticated %}
            <!-- Show this ONLY if logged in -->
            <a href="{% url 'profile' %}" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                {% if user.profile_picture %}
                    <!-- The actual uploaded image -->
                    <img src="{{ user.profile_picture.url }}" alt="Profile"
                        class="w-8 h-8 rounded-full object-cover border border-gray-300">
                    {% else %}
                    <!-- A placeholder if they haven't uploaded one -->
                    <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-xs font-michroma">
                        {{ user.name|slice:":1"|upper }}
                    </div>
                {% endif %}
            </a>
            <form action="{% url 'logout' %}" method="post" class="inline">
                {% csrf_token %}
                <button type="submit"
                    class="mx-4 hover:bg-black hover:text-white duration-300 ease-in px-2 py-0.5 rounded-sm">
                    Logout
                </button>
            </form>
            {% else %}
            <!-- Show this ONLY if logged out -->
            <a href="{% url 'login' %}" class="mx-4 hover:bg-black hover:text-white duration-300 ease-in px-2 py-0.5 rounded-sm">Login</a>
            <a href="{% url 'signup' %}" class="mx-4 hover:bg-black hover:text-white duration-300 ease-in px-2 py-0.5 rounded-sm">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4 bg-white shadow-xl border-t-2 border-gray-100 rounded">
        {% block content %}
        <!-- This is like 'yield' in Rails -->
        {% endblock %}
    </main>
</body>
</html>
