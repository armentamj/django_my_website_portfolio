services:
  redis:
    image: redis:alpine

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app # Syncs code for development
      - sqlite_data:/app/db_folder # Named volume for DB
      - media_data:/app/media # Named volume for user pics
    depends_on:
      - redis
    environment:
      - DEBUG=1

volumes:
  sqlite_data:
  media_data:
